
name: Build APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/main.yml'
      - 'index.html'
      - 'css/**'
      - 'js/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode website
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Periksa file website
        run: |
          test -f index.html
          test -d css
          test -d js

      - name: Siapkan proyek Capacitor
        run: |
          mkdir -p www/css www/js
          cp index.html www/index.html
          cp -r css/. www/css/
          cp -r js/. www/js/

          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.belajarku.catatanku",
            "appName": "CatatanKu",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Bangun APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: CatatanKu-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
